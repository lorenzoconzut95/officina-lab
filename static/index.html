<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officina Lab</title>
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
    <main class="container">
        <h1>Officina Lab</h1>
        <p class="subtitle">Task Dashboard</p>

        <section class="stats">
            <div class="stat-card"><span class="stat-label">Todo</span><strong id="todo-count">0</strong></div>
            <div class="stat-card"><span class="stat-label">Done</span><strong id="done-count">0</strong></div>
            <div class="stat-card"><span class="stat-label">Total</span><strong id="total-count">0</strong></div>
        </section>

        <section class="filters">
            <select id="filter-status">
                <option value="all">All statuses</option>
                <option value="todo">Todo</option>
                <option value="done">Done</option>
            </select>

            <select id="filter-priority">
                <option value="all">All priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <input id="filter-project" type="text" placeholder="Filter by project">
        </section>

        <section class="new-task">
            <h2>New Task</h2>
            <input id="task-title" type="text" placeholder="Task title">
            <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <input id="task-project" type="text" value="Officina Lab">
            <button id="create-task-button">Create Task</button>
        </section>

        <section>
            <h2>Tasks</h2>
            <div id="tasks"></div>
        </section>
    </main>

    <script src="/static/app.js?v=4"></script>
</body>
</html>
